name: Deploy to deployment repository

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source repository
      # --------------------------------------------------
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. 取得這次 push 的 commit message
      # --------------------------------------------------
      - name: Get commit message
        id: commit
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/[[:space:]]*$//')

          echo "Commit message:"
          echo "$COMMIT_MESSAGE"

          {
            echo "message<<EOF"
            echo "$COMMIT_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 3. Prepare deployment files
      # --------------------------------------------------
      - name: Prepare deployment files
        run: |
          mkdir -p ../deployment

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='script/' \
            --exclude='AGENT.md' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            ./ ../deployment/

      # --------------------------------------------------
      # 4. Checkout deployment repository
      # --------------------------------------------------
      - name: Checkout deployment repository
        uses: actions/checkout@v6
        with:
          repository: cnmc-tw/attendance_whiteboard_deploy
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deployment-repo

      # --------------------------------------------------
      # 5. Clean deployment repository
      # --------------------------------------------------
      - name: Clean deployment repository
        run: |
          find deployment-repo \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

      # --------------------------------------------------
      # 6. Copy deployment files
      # --------------------------------------------------
      - name: Copy deployment files
        run: |
          cp -a ../deployment/. deployment-repo/

      # --------------------------------------------------
      # 7. Show deployment files
      # --------------------------------------------------
      - name: Show deployment files
        run: |
          echo "===== Deployment files ====="

          find deployment-repo \
            -type f \
            ! -path 'deployment-repo/.git/*' \
            | sort

      # --------------------------------------------------
      # 8. Commit deployment repository
      # --------------------------------------------------
      - name: Commit deployment changes
        working-directory: deployment-repo
        env:
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Deploy: ${COMMIT_MESSAGE}"

      # --------------------------------------------------
      # 9. Push deployment repository
      # --------------------------------------------------
      - name: Push deployment repository
        working-directory: deployment-repo
        run: |
          git push origin HEAD:preview